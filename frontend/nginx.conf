server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (BrowserRouter) — a direct
    # request to e.g. /tickets/abc123 needs nginx to serve index.html and
    # let React Router figure out the route, instead of nginx 404ing because
    # no such FILE exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed asset filenames (Vite adds a content hash, so a
    # new deploy naturally gets new filenames — safe to cache "forever").
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
